[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "teaware-mujoco-collector"
version = "0.3.0"
description = "Standalone MuJoCo teaware scene generation, multimodal data collection, and web inspection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "mujoco>=3.3",
  "numpy>=1.26",
  "pillow>=10",
  "pyyaml>=6",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
teaware-mj = "teaware_mujoco.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teaware_mujoco = [
  "default_scene.yaml",
  "static/*",
  "assets/ufactory_xarm7/*",
  "assets/ufactory_xarm7/assets/*.stl",
  "assets/xhand/*.urdf",
  "assets/xhand/meshes/*.STL",
  "assets/xhand/meshes/*.obj",
  "assets/teaware/*.json",
  "assets/teaware/*/*.json",
  "assets/teaware/*/*.obj",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
