<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teaware MuJoCo Collector</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <div>
        <div class="product">TEAWARE / MUJOCO</div>
        <h1>场景数据采集台</h1>
      </div>
      <div class="status" id="status">连接中</div>
    </header>

    <main>
      <section class="viewer-panel">
        <div class="toolbar">
          <label>相机<select id="camera"></select></label>
          <div class="segments" id="modality">
            <button class="active" data-value="rgb">RGB</button>
            <button data-value="depth">Depth</button>
            <button data-value="segmentation">Segmentation</button>
          </div>
          <label>帧<input id="frame" type="range" min="0" max="0" value="0" /></label>
          <span id="frame-label">LIVE</span>
        </div>
        <div class="viewport"><img id="viewport" alt="MuJoCo camera view" /></div>
        <div class="scene-strip" id="scene-strip"></div>
      </section>

      <aside>
        <section class="control-section">
          <h2>采集</h2>
          <label>Seed<input id="seed" type="number" value="0" /></label>
          <label>Episodes<input id="count" type="number" min="1" max="100" value="1" /></label>
          <div class="actions">
            <button id="randomize">随机场景</button>
            <button class="primary" id="collect">开始采集</button>
          </div>
          <p class="message" id="message"></p>
        </section>

        <section class="episodes-section">
          <div class="section-title"><h2>Episodes</h2><button id="refresh">刷新</button></div>
          <div class="episodes" id="episodes"></div>
        </section>

        <section class="metadata-section">
          <h2>记录</h2>
          <pre id="metadata">选择一个 episode</pre>
        </section>
      </aside>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
